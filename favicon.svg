<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Go Stone representation -->
  <circle cx="16" cy="16" r="14" fill="#0a0f1d" />
  <!-- Glowing border representing Sente initiative -->
  <circle cx="16" cy="16" r="14" stroke="url(#cyan-grad)" stroke-width="2" />
  <!-- Subtle inner glow -->
  <circle cx="16" cy="16" r="10" fill="url(#cyan-grad)" opacity="0.15" />
  <!-- Sente Symbol -->
  <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="16" font-weight="900" fill="#00f2fe" text-anchor="middle">S</text>
  
  <defs>
    <linearGradient id="cyan-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
</svg>
